<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Estudiantes</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

header {
  background: #1f4e78;
  color: white;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.btn-volver {
  background: white;
  color: #1f4e78;
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.contenedor {
  width: 95%;
  max-width: 1400px;
  margin: 25px auto;
}

.panel {
  background: white;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}

.panel-superior {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.panel-superior h2 {
  margin: 0;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

.buscar {
  max-width: 450px;
}

.btn {
  border: none;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.btn-nuevo {
  background: #198754;
  color: white;
}

.btn-guardar {
  background: #1f4e78;
  color: white;
}

.btn-cancelar {
  background: #6c757d;
  color: white;
}

.btn-editar {
  background: #ffc107;
  color: #222;
  padding: 7px 10px;
  font-size: 12px;
}

.formulario {
  display: none;
  margin-top: 20px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.formulario h3 {
  margin-top: 0;
}

.grid-formulario {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.campo label {
  font-weight: bold;
  font-size: 14px;
}

.acciones-formulario {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

.tabla-contenedor {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

thead {
  background: #1f4e78;
  color: white;
}

th,
td {
  padding: 11px 9px;
  border-bottom: 1px solid #ddd;
  text-align: center;
  font-size: 13px;
}

tbody tr:hover {
  background: #f5f5f5;
}

.estado-activo {
  color: #198754;
  font-weight: bold;
}

.estado-inactivo {
  color: #dc3545;
  font-weight: bold;
}

.mensaje {
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 15px;
  display: none;
}

.mensaje.info {
  display: block;
  background: #cff4fc;
  color: #055160;
}

.mensaje.exito {
  display: block;
  background: #d1e7dd;
  color: #0f5132;
}

.mensaje.error {
  display: block;
  background: #f8d7da;
  color: #842029;
}

.sin-datos {
  padding: 30px;
  text-align: center;
  color: #777;
}

.cargando {
  padding: 30px;
  text-align: center;
  font-weight: bold;
}

@media (max-width: 700px) {

  .grid-formulario {
    grid-template-columns: 1fr;
  }

  header {
    flex-direction: column;
    align-items: stretch;
  }

  .btn-volver {
    width: 100%;
  }

  .panel-superior {
    align-items: stretch;
  }

  .buscar {
    max-width: none;
  }

  .btn-nuevo {
    width: 100%;
  }
}

</style>
</head>

<body>

<header>

  <h1>👨‍🎓 Gestión de Estudiantes</h1>

  <button
    class="btn-volver"
    onclick="volverAdmin()"
  >
    ← VOLVER AL PANEL
  </button>

</header>


<div class="contenedor">

  <!-- PANEL PRINCIPAL -->

  <div class="panel">

    <div class="panel-superior">

      <h2>Estudiantes registrados</h2>

      <input
        type="text"
        id="buscar"
        class="buscar"
        placeholder="🔎 Buscar por nombre, CI, país, foro, curso..."
        oninput="filtrarEstudiantes()"
      >

      <button
        class="btn btn-nuevo"
        onclick="mostrarFormularioNuevo()"
      >
        ➕ NUEVO ESTUDIANTE
      </button>

    </div>


    <!-- FORMULARIO -->

    <div
      id="formulario"
      class="formulario"
    >

      <h3 id="tituloFormulario">
        ➕ Registrar nuevo estudiante
      </h3>


      <div class="grid-formulario">

        <div class="campo">

          <label for="nuevoNombre">
            Nombre completo *
          </label>

          <input
            type="text"
            id="nuevoNombre"
            placeholder="Ej. JUAN PÉREZ"
          >

        </div>


        <div class="campo">

          <label for="nuevoCI">
            CI *
          </label>

          <input
            type="text"
            id="nuevoCI"
            placeholder="Ej. 123456"
          >

        </div>


        <div class="campo">

          <label for="nuevoPais">
            País
          </label>

          <input
            type="text"
            id="nuevoPais"
            placeholder="Ej. BOLIVIA"
          >

        </div>


        <div class="campo">

          <label for="nuevoForo">
            Foro *
          </label>

          <input
            type="text"
            id="nuevoForo"
            placeholder="Ej. OMS"
          >

        </div>


        <div class="campo">

          <label for="nuevoCurso">
            Curso *
          </label>

          <input
            type="text"
            id="nuevoCurso"
            placeholder="Ej. 2A"
          >

        </div>


        <div class="campo">

          <label for="nuevoUsuario">
            Usuario *
          </label>

          <input
            type="text"
            id="nuevoUsuario"
            placeholder="Ej. alumno001"
          >

        </div>


        <div class="campo">

          <label for="nuevoContrasena" id="labelContrasena">
            Contraseña *
          </label>

          <input
            type="password"
            id="nuevoContrasena"
            placeholder="Contraseña"
          >

        </div>

      </div>


      <div class="acciones-formulario">

        <button
          id="btnGuardar"
          class="btn btn-guardar"
          onclick="guardarEstudiante()"
        >
          💾 REGISTRAR ESTUDIANTE
        </button>

        <button
          class="btn btn-cancelar"
          onclick="cancelarFormulario()"
        >
          ✖ CANCELAR
        </button>

      </div>

    </div>

  </div>


  <!-- MENSAJES -->

  <div
    id="mensaje"
    class="mensaje"
  ></div>


  <!-- TABLA -->

  <div class="panel">

    <div class="tabla-contenedor">

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Código QR</th>
            <th>Nombre</th>
            <th>CI</th>
            <th>País</th>
            <th>Foro</th>
            <th>Estado</th>
            <th>Curso</th>
            <th>Usuario</th>
            <th>Acciones</th>

          </tr>

        </thead>

        <tbody id="tablaEstudiantes">

          <tr>
            <td
              colspan="10"
              class="cargando"
            >
              ⏳ Cargando estudiantes...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API_URL =
  "https://quiet-lab-973a.cristimi1232.workers.dev/";


let tokenAdmin =
  sessionStorage.getItem("tokenAdmin");


let estudiantes = [];


/*
  Si estamos editando:
  aquí guardamos el estudiante seleccionado.
*/
let estudianteEditando = null;


/* =====================================================
   LLAMAR API
===================================================== */

async function llamarAPI(api, datos = {}) {

  const respuesta = await fetch(
    API_URL,
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        api: api,
        ...datos
      })
    }
  );

  const texto =
    await respuesta.text();

  let resultado;

  try {

    resultado =
      JSON.parse(texto);

  } catch (error) {

    console.error(
      "Respuesta no válida:",
      texto
    );

    throw new Error(
      "El servidor devolvió una respuesta no válida."
    );
  }

  return resultado;
}


/* =====================================================
   VERIFICAR SESIÓN
===================================================== */

function verificarSesion() {

  tokenAdmin =
    sessionStorage.getItem("tokenAdmin");

  if (!tokenAdmin) {

    window.location.href =
      "admin.html";

    return false;
  }

  return true;
}


/* =====================================================
   MOSTRAR MENSAJE
===================================================== */

function mostrarMensaje(
  texto,
  tipo = "info"
) {

  const elemento =
    document.getElementById("mensaje");

  elemento.textContent =
    texto;

  elemento.className =
    "mensaje " + tipo;

}


/* =====================================================
   CARGAR ESTUDIANTES
===================================================== */

async function cargarEstudiantes() {

  if (!verificarSesion()) {
    return;
  }

  const tabla =
    document.getElementById(
      "tablaEstudiantes"
    );

  tabla.innerHTML = `
    <tr>
      <td colspan="10" class="cargando">
        ⏳ Cargando estudiantes...
      </td>
    </tr>
  `;

  try {

    const resultado =
      await llamarAPI(
        "listarEstudiantes",
        {
          token: tokenAdmin
        }
      );


    if (!resultado.exito) {

      tabla.innerHTML = `
        <tr>
          <td colspan="10" class="sin-datos">
            ❌ ${
              resultado.mensaje ||
              "No se pudieron cargar los estudiantes."
            }
          </td>
        </tr>
      `;

      return;
    }


    estudiantes =
      resultado.estudiantes || [];


    mostrarEstudiantes(
      estudiantes
    );


  } catch (error) {

    console.error(error);

    tabla.innerHTML = `
      <tr>
        <td colspan="10" class="sin-datos">
          ❌ No se pudo comunicar con el servidor.
        </td>
      </tr>
    `;

  }

}


/* =====================================================
   MOSTRAR ESTUDIANTES
===================================================== */

function mostrarEstudiantes(lista) {

  const tabla =
    document.getElementById(
      "tablaEstudiantes"
    );


  if (!lista || lista.length === 0) {

    tabla.innerHTML = `
      <tr>
        <td colspan="10" class="sin-datos">
          No existen estudiantes registrados.
        </td>
      </tr>
    `;

    return;
  }


  tabla.innerHTML =
    lista.map(
      function(estudiante) {

        const estado =
          String(
            estudiante.estado || ""
          ).trim().toUpperCase();


        const claseEstado =
          estado === "ACTIVO"
            ? "estado-activo"
            : "estado-inactivo";


        return `
          <tr>

            <td>
              ${escapeHTML(
                estudiante.id
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.codigoQR
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.nombre
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.ci
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.pais
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.foro
              )}
            </td>

            <td class="${claseEstado}">
              ${escapeHTML(
                estudiante.estado
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.curso
              )}
            </td>

            <td>
              ${escapeHTML(
                estudiante.usuario
              )}
            </td>

            <td>

              <button
                class="btn btn-editar"
                onclick="editarEstudianteWeb('${escapeJS(estudiante.id)}')"
              >
                ✏️ EDITAR
              </button>

            </td>

          </tr>
        `;

      }
    ).join("");

}


/* =====================================================
   BUSCAR / FILTRAR
===================================================== */

function filtrarEstudiantes() {

  const texto =
    document
      .getElementById("buscar")
      .value
      .trim()
      .toLowerCase();


  if (!texto) {

    mostrarEstudiantes(
      estudiantes
    );

    return;
  }


  const filtrados =
    estudiantes.filter(
      function(estudiante) {

        const contenido = [

          estudiante.id,
          estudiante.codigoQR,
          estudiante.nombre,
          estudiante.ci,
          estudiante.pais,
          estudiante.foro,
          estudiante.estado,
          estudiante.curso,
          estudiante.usuario

        ]
        .join(" ")
        .toLowerCase();


        return contenido.includes(
          texto
        );

      }
    );


  mostrarEstudiantes(
    filtrados
  );

}


/* =====================================================
   FORMULARIO NUEVO
===================================================== */

function mostrarFormularioNuevo() {

  estudianteEditando = null;


  document.getElementById(
    "tituloFormulario"
  ).textContent =
    "➕ Registrar nuevo estudiante";


  document.getElementById(
    "btnGuardar"
  ).textContent =
    "💾 REGISTRAR ESTUDIANTE";


  document.getElementById(
    "labelContrasena"
  ).textContent =
    "Contraseña *";


  document.getElementById(
    "nuevoContrasena"
  ).placeholder =
    "Contraseña";


  limpiarCampos();


  document.getElementById(
    "formulario"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   EDITAR ESTUDIANTE
===================================================== */

function editarEstudianteWeb(id) {

  const estudiante =
    estudiantes.find(
      function(item) {

        return String(
          item.id
        ) === String(id);

      }
    );


  if (!estudiante) {

    alert(
      "❌ No se encontró el estudiante."
    );

    return;
  }


  estudianteEditando =
    estudiante;


  document.getElementById(
    "tituloFormulario"
  ).textContent =
    "✏️ Editar estudiante";


  document.getElementById(
    "btnGuardar"
  ).textContent =
    "💾 GUARDAR CAMBIOS";


  document.getElementById(
    "labelContrasena"
  ).textContent =
    "Nueva contraseña (opcional)";


  document.getElementById(
    "nuevoNombre"
  ).value =
    estudiante.nombre || "";


  document.getElementById(
    "nuevoCI"
  ).value =
    estudiante.ci || "";


  document.getElementById(
    "nuevoPais"
  ).value =
    estudiante.pais || "";


  document.getElementById(
    "nuevoForo"
  ).value =
    estudiante.foro || "";


  document.getElementById(
    "nuevoCurso"
  ).value =
    estudiante.curso || "";


  document.getElementById(
    "nuevoUsuario"
  ).value =
    estudiante.usuario || "";


  document.getElementById(
    "nuevoContrasena"
  ).value =
    "";


  document.getElementById(
    "nuevoContrasena"
  ).placeholder =
    "Dejar vacío para conservar la contraseña actual";


  document.getElementById(
    "formulario"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   GUARDAR ESTUDIANTE
===================================================== */

async function guardarEstudiante() {

  if (!verificarSesion()) {
    return;
  }


  const nombre =
    document.getElementById(
      "nuevoNombre"
    ).value.trim();


  const ci =
    document.getElementById(
      "nuevoCI"
    ).value.trim();


  const pais =
    document.getElementById(
      "nuevoPais"
    ).value.trim();


  const foro =
    document.getElementById(
      "nuevoForo"
    ).value.trim();


  const curso =
    document.getElementById(
      "nuevoCurso"
    ).value.trim();


  const usuario =
    document.getElementById(
      "nuevoUsuario"
    ).value.trim();


  const contrasena =
    document.getElementById(
      "nuevoContrasena"
    ).value.trim();


  /* ---------------------------------------------
     VALIDACIONES
  --------------------------------------------- */

  if (
    !nombre ||
    !ci ||
    !foro ||
    !curso ||
    !usuario
  ) {

    alert(
      "❌ Completa todos los campos obligatorios."
    );

    return;
  }


  /*
    Si es un estudiante NUEVO,
    la contraseña es obligatoria.
  */

  if (
    !estudianteEditando &&
    !contrasena
  ) {

    alert(
      "❌ La contraseña es obligatoria."
    );

    return;
  }


  const boton =
    document.getElementById(
      "btnGuardar"
    );


  boton.disabled = true;


  try {

    let resultado;


    /* =================================================
       EDITAR
    ================================================= */

    if (estudianteEditando) {

      mostrarMensaje(
        "⏳ Guardando cambios...",
        "info"
      );


      resultado =
        await llamarAPI(
          "editarEstudiante",
          {

            token:
              tokenAdmin,

            idEstudiante:
              estudianteEditando.id,

            nombre:
              nombre,

            ci:
              ci,

            pais:
              pais,

            foro:
              foro,

            curso:
              curso,

            usuario:
              usuario,

            contrasena:
              contrasena

          }
        );

    }


    /* =================================================
       REGISTRAR NUEVO
    ================================================= */

    else {

      mostrarMensaje(
        "⏳ Registrando estudiante...",
        "info"
      );


      resultado =
        await llamarAPI(
          "registrarEstudiante",
          {

            token:
              tokenAdmin,

            nombre:
              nombre,

            ci:
              ci,

            pais:
              pais,

            foro:
              foro,

            curso:
              curso,

            usuario:
              usuario,

            contrasena:
              contrasena

          }
        );

    }


    /* =================================================
       RESULTADO
    ================================================= */

    if (!resultado.exito) {

      mostrarMensaje(
        resultado.mensaje ||
        "❌ No se pudo guardar.",
        "error"
      );

      return;
    }


    mostrarMensaje(
      resultado.mensaje ||
      "✅ Operación realizada correctamente.",
      "exito"
    );


    cancelarFormulario();


    await cargarEstudiantes();


  } catch (error) {

    console.error(error);

    mostrarMensaje(
      "❌ No se pudo comunicar con el servidor.",
      "error"
    );

  } finally {

    boton.disabled = false;

  }

}


/* =====================================================
   CANCELAR FORMULARIO
===================================================== */

function cancelarFormulario() {

  estudianteEditando = null;


  document.getElementById(
    "formulario"
  ).style.display =
    "none";


  limpiarCampos();


  document.getElementById(
    "tituloFormulario"
  ).textContent =
    "➕ Registrar nuevo estudiante";


  document.getElementById(
    "btnGuardar"
  ).textContent =
    "💾 REGISTRAR ESTUDIANTE";


  document.getElementById(
    "labelContrasena"
  ).textContent =
    "Contraseña *";


  document.getElementById(
    "nuevoContrasena"
  ).placeholder =
    "Contraseña";

}


/* =====================================================
   LIMPIAR CAMPOS
===================================================== */

function limpiarCampos() {

  document.getElementById(
    "nuevoNombre"
  ).value = "";


  document.getElementById(
    "nuevoCI"
  ).value = "";


  document.getElementById(
    "nuevoPais"
  ).value = "";


  document.getElementById(
    "nuevoForo"
  ).value = "";


  document.getElementById(
    "nuevoCurso"
  ).value = "";


  document.getElementById(
    "nuevoUsuario"
  ).value = "";


  document.getElementById(
    "nuevoContrasena"
  ).value = "";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(valor) {

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   ESCAPAR ID PARA onclick
===================================================== */

function escapeJS(valor) {

  return String(
    valor ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* =====================================================
   VOLVER AL PANEL
===================================================== */

function volverAdmin() {

  window.location.href =
    "admin.html";

}


/* =====================================================
   INICIO
===================================================== */

verificarSesion();

cargarEstudiantes();

</script>

</body>
</html>
