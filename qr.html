<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Código QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .tarjeta {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    h1 {
      color: #1e3a8a;
      margin-top: 0;
    }

    .nombre {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 5px;
    }

    .codigo {
      color: #64748b;
      margin-bottom: 10px;
    }

    .temporizador {
      font-weight: bold;
      color: #1e3a8a;
      margin: 10px 0;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      padding: 15px;
      background: white;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .instruccion {
      color: #475569;
      font-size: 15px;
      margin-top: 20px;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 10px;
    }

    .cargando {
      color: #475569;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="tarjeta">

    <h1>🎓 Código QR</h1>

    <div id="contenido">

      <div id="nombre" class="nombre"></div>

      <div id="codigo" class="codigo"></div>

      <div id="temporizador" class="temporizador">
        Generando código...
      </div>

      <div id="qrcode"></div>

      <div class="instruccion">
        📱 Muestra este código al escáner para registrar tu asistencia.
      </div>

    </div>

  </div>


  <!-- Librería para generar QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const URL_WORKER =
      "https://quiet-lab-973a.cristimi1232.workers.dev";


    const DURACION_QR = 30;


    // =====================================================
    // OBTENER DATOS DEL ESTUDIANTE
    // =====================================================

    const parametros =
      new URLSearchParams(window.location.search);


    const codigo =
      parametros.get("codigo");


    const nombre =
      parametros.get("nombre");


    // =====================================================
    // ELEMENTOS DE LA PÁGINA
    // =====================================================

    const elementoNombre =
      document.getElementById("nombre");

    const elementoCodigo =
      document.getElementById("codigo");

    const elementoQR =
      document.getElementById("qrcode");

    const elementoTemporizador =
      document.getElementById("temporizador");


    // =====================================================
    // VALIDAR ESTUDIANTE
    // =====================================================

    if (!codigo) {

      document.getElementById("contenido").innerHTML = `
        <div class="error">
          ❌ No se proporcionó un código de estudiante.
        </div>
      `;

    } else {

      elementoNombre.textContent =
        nombre || "Estudiante";

      elementoCodigo.textContent =
        "Código: " + codigo;


      // Generar primer QR
      generarQRTemporal();


      // Renovar automáticamente
      setInterval(
        generarQRTemporal,
        DURACION_QR * 1000
      );

    }


    // =====================================================
    // SOLICITAR QR TEMPORAL AL SERVIDOR
    // =====================================================

    async function generarQRTemporal() {

      try {

        elementoTemporizador.textContent =
          "Generando nuevo código...";


        const respuesta = await fetch(
          URL_WORKER,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              api: "generarQRTemporal",
              codigoEstudiante: codigo
            })
          }
        );


        if (!respuesta.ok) {
          throw new Error(
            "HTTP " + respuesta.status
          );
        }


        const resultado =
          await respuesta.json();


        if (!resultado.exito) {

          mostrarError(
            resultado.mensaje ||
            "No se pudo generar el QR."
          );

          return;
        }


        // Mostrar QR temporal
        mostrarQR(resultado.token);


        // Iniciar contador
        iniciarTemporizador(
          resultado.segundos || DURACION_QR
        );


      } catch (error) {

        console.error(
          "Error:",
          error
        );

        mostrarError(
          "❌ No se pudo comunicar con el servidor."
        );

      }

    }


    // =====================================================
    // MOSTRAR QR
    // =====================================================

    function mostrarQR(token) {

      // Limpiar QR anterior
      elementoQR.innerHTML = "";


      // Crear nuevo QR
      new QRCode(
        elementoQR,
        {
          text: token,
          width: 280,
          height: 280,
          correctLevel: QRCode.CorrectLevel.H
        }
      );

    }


    // =====================================================
    // CONTADOR DE 30 SEGUNDOS
    // =====================================================

    function iniciarTemporizador(segundos) {

      let restante = segundos;


      elementoTemporizador.textContent =
        "⏱️ Código válido durante: " +
        restante +
        " segundos";


      const intervalo =
        setInterval(() => {

          restante--;


          if (restante <= 0) {

            clearInterval(intervalo);

            elementoTemporizador.textContent =
              "🔄 Generando nuevo código...";

            return;
          }


          elementoTemporizador.textContent =
            "⏱️ Código válido durante: " +
            restante +
            " segundos";

        }, 1000);

    }


    // =====================================================
    // MOSTRAR ERROR
    // =====================================================

    function mostrarError(mensaje) {

      elementoQR.innerHTML = "";

      elementoTemporizador.textContent = "";

      elementoQR.innerHTML = `
        <div class="error">
          ${mensaje}
        </div>
      `;

    }

  </script>

</body>
</html>
