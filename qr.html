<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Código QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .tarjeta {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    h1 {
      color: #1e3a8a;
      margin-top: 0;
    }

    .nombre {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 5px;
    }

    .foro {
      color: #64748b;
      margin-bottom: 10px;
    }

    .temporizador {
      font-weight: bold;
      color: #1e3a8a;
      margin: 10px 0;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      padding: 15px;
      background: white;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .instruccion {
      color: #475569;
      font-size: 15px;
      margin-top: 20px;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 10px;
    }

    .cargando {
      color: #475569;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="tarjeta">

    <h1>🎓 Código QR</h1>

    <div id="contenido">

      <div id="nombre" class="nombre">
        Cargando...
      </div>

      <div id="foro" class="foro"></div>

      <div id="temporizador" class="temporizador">
        Verificando acceso...
      </div>

      <div id="qrcode"></div>

      <div class="instruccion">
        📱 Muestra este código al escáner para registrar tu asistencia.
      </div>

    </div>

  </div>


  <!-- Librería para generar QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const URL_WORKER =
      "https://quiet-lab-973a.cristimi1232.workers.dev";


    const DURACION_QR = 30;


    // =====================================================
    // OBTENER TOKEN PERSONAL DE LA URL
    // =====================================================

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const tokenAcceso =
      parametros.get("acceso");


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const elementoNombre =
      document.getElementById("nombre");

    const elementoForo =
      document.getElementById("foro");

    const elementoQR =
      document.getElementById("qrcode");

    const elementoTemporizador =
      document.getElementById("temporizador");


    // =====================================================
    // DATOS DEL ESTUDIANTE
    // =====================================================

    let codigoEstudiante = null;


    // =====================================================
    // INICIO
    // =====================================================

    if (!tokenAcceso) {

      mostrarError(
        "❌ Enlace de estudiante no válido."
      );

    } else {

      obtenerEstudiante();

    }


    // =====================================================
    // OBTENER ESTUDIANTE
    // =====================================================

    async function obtenerEstudiante() {

      try {

        elementoTemporizador.textContent =
          "Verificando acceso...";


        const respuesta =
          await fetch(
            URL_WORKER,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                api: "obtenerEstudiante",

                tokenAcceso:
                  tokenAcceso

              })

            }
          );


        if (!respuesta.ok) {

          throw new Error(
            "HTTP " + respuesta.status
          );

        }


        const resultado =
          await respuesta.json();


        if (!resultado.exito) {

          mostrarError(
            resultado.mensaje ||
            "❌ Enlace no válido."
          );

          return;
        }


        // Guardamos el código internamente
        codigoEstudiante =
          resultado.codigo;


        // Mostramos los datos
        elementoNombre.textContent =
          resultado.nombre;


        elementoForo.textContent =
          "Foro: " + resultado.foro;


        // Generar primer QR
        generarQRTemporal();


        // Renovar cada 30 segundos
        setInterval(
          generarQRTemporal,
          DURACION_QR * 1000
        );


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        mostrarError(
          "❌ No se pudo comunicar con el servidor."
        );

      }

    }


    // =====================================================
    // GENERAR QR TEMPORAL
    // =====================================================

    async function generarQRTemporal() {

      try {

        elementoTemporizador.textContent =
          "Generando nuevo código...";


        const respuesta =
          await fetch(
            URL_WORKER,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                api:
                  "generarQRTemporal",

                codigoEstudiante:
                  codigoEstudiante

              })

            }
          );


        if (!respuesta.ok) {

          throw new Error(
            "HTTP " + respuesta.status
          );

        }


        const resultado =
          await respuesta.json();


        if (!resultado.exito) {

          mostrarError(
            resultado.mensaje ||
            "❌ No se pudo generar el QR."
          );

          return;
        }


        // Mostrar el nuevo QR
        mostrarQR(
          resultado.token
        );


        // Reiniciar contador
        iniciarTemporizador(
          resultado.segundos ||
          DURACION_QR
        );


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        mostrarError(
          "❌ No se pudo generar el código."
        );

      }

    }


    // =====================================================
    // MOSTRAR QR
    // =====================================================

    function mostrarQR(token) {

      elementoQR.innerHTML = "";


      new QRCode(

        elementoQR,

        {
          text: token,

          width: 280,

          height: 280,

          correctLevel:
            QRCode.CorrectLevel.H
        }

      );

    }


    // =====================================================
    // CONTADOR
    // =====================================================

    function iniciarTemporizador(segundos) {

      let restante =
        segundos;


      elementoTemporizador.textContent =
        "⏱️ Código válido durante: " +
        restante +
        " segundos";


      const intervalo =
        setInterval(

          function() {

            restante--;


            if (restante <= 0) {

              clearInterval(
                intervalo
              );


              elementoTemporizador.textContent =
                "🔄 Generando nuevo código...";


              return;

            }


            elementoTemporizador.textContent =
              "⏱️ Código válido durante: " +
              restante +
              " segundos";

          },

          1000

        );

    }


    // =====================================================
    // ERROR
    // =====================================================

    function mostrarError(mensaje) {

      elementoNombre.textContent = "";

      elementoForo.textContent = "";

      elementoTemporizador.textContent = "";

      elementoQR.innerHTML = `
        <div class="error">
          ${mensaje}
        </div>
      `;

    }

  </script>

</body>
</html>
